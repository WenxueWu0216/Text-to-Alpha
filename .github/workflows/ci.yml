name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pytest (model mocked)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            service/requirements.txt
      - run: pip install -r requirements-ci.txt
      - run: ruff check .
      - run: pytest -q

  eval-gate:
    name: eval gate (served image, x86)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            service/requirements.txt
      - run: pip install -r requirements-ci.txt
      - name: CPU (int8 kernels depend on it)
        run: |
          lscpu | grep "Model name"
          grep -o -w -E 'avx2|avx512f|avx512_vnni|avx_vnni' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
      - uses: docker/setup-buildx-action@v3
      # Layer cache in GitHub's cache: the export stage (torch + pinned FinBERT download + ONNX
      # export) only reruns when the Dockerfile, export script or its requirements change.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile
          tags: t2a-service:ci
          load: true
          cache-from: type=gha,scope=t2a-service
          cache-to: type=gha,mode=max,scope=t2a-service
      - name: Image size
        run: |
          docker image inspect t2a-service:ci --format '{{.Size}}' | awk '{printf "image %.0f MB\n", $1/1e6}'
      - name: Start the image
        run: |
          docker run -d --name svc -p 8080:8080 t2a-service:ci
          for i in $(seq 1 60); do curl -sf localhost:8080/health && exit 0; sleep 1; done
          docker logs svc; exit 1
      - name: Eval gate against the running image
        run: python scripts/eval_gate.py --url http://127.0.0.1:8080 --out gate/gate_metrics.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-metrics
          path: gate/
          if-no-files-found: ignore
