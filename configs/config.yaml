# ---- Universe ----
# Large, liquid names with dense news coverage.
# Aliases (split by "|") are used to mask company identity in LLM prompts,
# which reduces look-ahead bias from the LLM's pretraining memory.
universe:
  AAPL: Apple
  MSFT: Microsoft
  AMZN: Amazon
  GOOGL: Alphabet|Google
  META: Meta Platforms|Facebook
  NVDA: Nvidia
  TSLA: Tesla
  NFLX: Netflix
  AMD: Advanced Micro Devices|AMD
  INTC: Intel
  CSCO: Cisco
  ORCL: Oracle
  CRM: Salesforce
  ADBE: Adobe
  QCOM: Qualcomm
  AVGO: Broadcom
  TXN: Texas Instruments
  IBM: International Business Machines|IBM
  PYPL: PayPal
  UBER: Uber
  JPM: JPMorgan|JP Morgan
  BAC: Bank of America
  GS: Goldman Sachs
  MS: Morgan Stanley
  WFC: Wells Fargo
  C: Citigroup|Citi
  V: Visa
  MA: Mastercard
  JNJ: Johnson & Johnson
  PFE: Pfizer
  MRK: Merck
  ABBV: AbbVie
  UNH: UnitedHealth
  WMT: Walmart
  COST: Costco
  HD: Home Depot
  NKE: Nike
  SBUX: Starbucks
  DIS: Disney
  BA: Boeing
  XOM: ExxonMobil|Exxon
  CVX: Chevron
  KO: Coca-Cola
  PEP: PepsiCo|Pepsi
  MCD: McDonald's

dates:
  start: "2018-01-01"
  end: "2023-12-31"

paths:
  raw_news_csv: data/raw/nasdaq_exteral_data.csv   # FNSPID file (typo is upstream)
  news: data/processed/news.parquet
  prices: data/processed/prices.parquet
  panel: data/processed/panel.parquet               # one row per (date, ticker)
  events: data/processed/events.parquet             # one row per news item, aligned
  signals_dir: data/signals
  llm_cache: data/cache/llm_cache.sqlite
  llm_ledger: data/cache/spend_ledger.jsonl
  vix: data/processed/vix.parquet
  lexicon_dir: data/lexicon
  data_quality: data/processed/data_quality_raw.json  # written by step 1 from the raw CSV

labels:
  horizon_days: 1        # return from open(D) to open(D+h)
  top_quantile: 0.3      # cross-sectional top 30% -> +1, bottom 30% -> -1, else 0

split:                   # chronological, purged
  train_end: "2021-12-31"
  val_end: "2022-12-31"  # test = after val_end; do not touch until the very end
  embargo_days: 5        # gap between splits, must be >= horizon_days

eval:
  min_names_per_day: 5   # skip days with too few names for a cross-sectional IC
  cost_bps_per_side: 5        # headline cost, charged on actual turnover (5/side = 10 round trip)
  cost_grid_bps_per_side: [0, 5, 10, 20]

finbert:
  model: ProsusAI/finbert
  batch_size: 64
  max_length: 64

llm:
  model: claude-haiku-4-5-20251001
  max_concurrency: 8
  mask_entities: true
  seed: 0
  # Anthropic first-party list price for Haiku 4.5 (USD per 1M tokens); Batches API = 50%.
  prices_per_mtok: {input: 1.0, output: 5.0}
  est_output_tokens: 120        # used for the pre-run estimate until real usage is measured
  budget:
    total_usd: 15.0             # hard cap across ALL API runs (ledger in data/cache/)
    reserve_teacher_usd: 4.0    # held back for B1 teacher labels; benchmark runs may not use it
  variants:
    zero_shot:
      split: val
      max_news_per_stock_day: 1
      n_days: null              # null = every val day
      n_examples: 0
      latency_sample: 200       # sync calls for real latency; the rest go through the Batches API
      max_usd: 9.0
      respect_teacher_reserve: true   # may NOT spend into the B1 reserve
    few_shot:
      split: val
      max_news_per_stock_day: 1
      n_days: null              # set after the zero-shot run, from the remaining budget
      examples_per_class: {1: 3, -1: 3, 0: 2}
      latency_sample: 100
      max_usd: 5.0
      respect_teacher_reserve: true
